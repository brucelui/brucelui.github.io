<!DOCTYPE html>

<!--Handcoded by Bruce Lui-->
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, maximum-scale=1.0, minimum-scale=1.0, initial-scale=1.0" />
		<meta name="author" content="Bruce Lui">
		<meta name="keywords" content="Bruce Lui, brucelui, siat, portfolio, design, ux, ui, product design" />
		<meta name="description" content="Product Designer.">
		
		<title>Password Required - Bruce Lui</title>
		
		<!-- CSS -->
		<link rel="stylesheet" type="text/css" href="css/foundation.min.css" />
		<link rel="stylesheet" type="text/css" href="css/style.css" />
		<link rel="stylesheet" type="text/css" media="only screen and (min-width:50px) and (max-width:599px)" href="css/style_small.css" />
		<link rel="stylesheet" type="text/css" media="only screen and (min-width:600px) and (max-width:980px)" href="css/style_medium.css" />
		
		<!-- FONTS -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
		
		<style>
			.password-icon {
				/* width: 40px;
				height: 40px; */
				margin-bottom: 20px;
			}

			.password-container {
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				padding: 20px;
				flex-direction: column;
				text-align: center;
			}
			
			.password-modal {
				background-color: var(--color-white);
				padding: 40px;
				border-radius: 40px;
				/* box-shadow: 0 4px 20px rgba(43, 43, 43, 0.2); */
				max-width: 400px;
				width: 100%;
				text-align: center;
			}
			
			.password-modal h2 {
				font-family: "Crimson Pro", serif;
				font-size: 36px;
				font-weight: 400;
				margin: 0 0 20px 0;
				color: var(--color-primary);
			}
			
			.password-modal p {
				font-size: 18px;
				color: var(--color-primary);
				margin: 0 0 30px 0;
			}
			
			.password-form {
				margin-bottom: 0px;
			}
			
			#password-input {
				width: 100%;
				height: 48px;
				padding: 12px 16px;
				font-size: 18px;
				font-family: "Noto Sans", serif;
				border: 2px solid var(--color-secondary);
				border-radius: 8px;
				box-sizing: border-box;
				color: var(--color-primary);
				background-color: var(--color-white);
				margin-bottom: 10px;
			}
			
			#password-input:focus {
				outline: none;
				border-color: var(--color-primary);
			}
			
			#password-error {
				color: #d32f2f;
				font-size: 14px;
				margin-top: 10px;
				min-height: 20px;
				display: none;
			}
			
			#password-submit {
				display: inline-block;
				padding: 12px 24px;
				height: 48px;
				font-size: 18px;
				font-family: "Noto Sans", serif;
				background-color: var(--color-primary);
				color: var(--color-white);
				border: none;
				border-radius: 100px;
				cursor: pointer;
				text-decoration: none;
				margin-top: 10px;
				width: 100%;
			}
			
			#password-submit:hover {
				background-color: var(--color-black);
			}
			
			#password-submit:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}
		</style>
	</head>

	<body>
		<header>
			<a class="logo" href="./index.html" aria-label="Home"></a>
		</header>
		<div class="password-container">
			<div class="password-modal">
				<!-- <h2>What's the password?</h2> -->
				<img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2QxaGZmdDhhc241anlhOTR5NW54aDQ4YjM1M2YxdzJoN2FtN2R2MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3orieXilvlk5psxl7y/giphy.gif" alt="Password Required" class="password-icon">
				<p>Please enter the password to view my case studies.</p>
				<form class="password-form" id="password-form">
					<input 
						type="password" 
						id="password-input" 
						placeholder="Enter password" 
						autocomplete="off"
						autofocus
					>
					<div id="password-error"></div>
					<button type="submit" id="password-submit">Submit</button>
				</form>
			</div>
			<br><p>If you would like access, please <a href="mailto:brucelui9@gmail.com">email me</a>!</p>
		</div>
		
		<script src="js/password-auth.js"></script>
	</body>
</html>
